<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Workflow Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .options {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .workflow {
            display: none;
        }
        
        .workflow.active {
            display: block;
        }
        
        .workflow-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .workflow-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .workflow-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .badge-easy { background: #d4edda; color: #155724; }
        .badge-medium { background: #fff3cd; color: #856404; }
        .badge-hard { background: #f8d7da; color: #721c24; }
        
        .step {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .step:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .step-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .step-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }
        
        .search-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .search-label {
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .search-query {
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .test-search {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .test-search:hover {
            background: #764ba2;
        }
        
        .expected-results {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        
        .instructions {
            background: #fff9e6;
            padding: 15px;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            margin: 15px 0;
        }
        
        .instructions strong {
            color: #856404;
        }
        
        .key-phrases {
            margin: 15px 0;
        }
        
        .key-phrases-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .phrase-tag {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
        }
        
        .alternatives {
            margin-top: 15px;
        }
        
        .alternatives summary {
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            padding: 8px 0;
        }
        
        .alternatives summary:hover {
            color: #764ba2;
        }
        
        .alt-search {
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .validation {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .validation-title {
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .search-results {
            list-style: none;
        }
        
        .search-results li {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
        }
        
        .search-results a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 500;
        }
        
        .search-results a:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        #annotations {
            display: none;
        }
        
        #annotations.active {
            display: block;
        }
        
        .annotation-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .annotation-header h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .annotation-step {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .annotation-step h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .actions-list {
            margin-top: 15px;
        }
        
        .actions-list h4 {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .action-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .action-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .action-details {
            flex: 1;
        }
        
        .action-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .action-details p {
            margin: 5px 0;
            color: #333;
        }
        
        .action-details code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .action-notes {
            color: #666;
            font-style: italic;
            margin-top: 8px;
        }
        
        .export-annotations {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .export-annotations button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .export-annotations button:hover {
            background: #764ba2;
        }
        
        /* Annotation specific styles */
        .annotation-header {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-left: 4px solid #0284c7;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .annotation-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .annotation-meta span {
            background: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .annotation-guidelines {
            margin-top: 15px;
            padding: 15px;
            background: #fff9e6;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .annotation-step {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
        }
        
        .step-header h3 {
            color: #1f2937;
            margin: 0;
        }
        
        .step-duration {
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .step-search {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .step-search code {
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #667eea;
            flex: 1;
            min-width: 200px;
        }
        
        .test-search-btn {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .test-search-btn:hover {
            background: #764ba2;
        }
        
        .actions-list {
            margin-top: 20px;
        }
        
        .actions-list h4 {
            color: #374151;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .action-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            background: #f9fafb;
            border-radius: 6px;
            border-left: 3px solid #667eea;
            transition: all 0.3s;
        }
        
        .action-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }
        
        .action-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .action-details {
            flex: 1;
        }
        
        .action-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .badge-click {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .badge-right_click {
            background: #fce7f3;
            color: #be185d;
        }
        
        .badge-input {
            background: #dcfce7;
            color: #166534;
        }
        
        .badge-drag {
            background: #fef3c7;
            color: #92400e;
        }
        
        .badge-key_press {
            background: #f3e8ff;
            color: #6b21a8;
        }
        
        .badge-scroll {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .badge-hover {
            background: #fecaca;
            color: #991b1b;
        }
        
        .action-description {
            color: #374151;
            line-height: 1.6;
            margin: 0;
        }
        
        .export-annotations {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        
        .simple-explanation {
            background: linear-gradient(135deg, #fff9e6 0%, #ffedd5 100%);
            border-left: 4px solid #f59e0b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        
        .explanation-icon {
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .explanation-text {
            flex: 1;
            line-height: 1.6;
            color: #78350f;
        }
        
        .explanation-text strong {
            color: #92400e;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Task Workflow Generator</h1>
            <p>Break down any task into step-by-step instructions with Google searches</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <label for="taskInput">📝 Describe your task:</label>
                <textarea 
                    id="taskInput" 
                    placeholder="Example: Create an Excel chart with rounded bars and gradient text, or Create a PowerPoint with stars on each slide"
                ></textarea>
                
                <div class="options">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="validateSearches">
                        <label for="validateSearches" style="margin: 0;">Validate searches (slower but more accurate)</label>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" id="generateBtn" onclick="generateWorkflow()">
                        Generate Workflow
                    </button>
                    <button class="btn-primary" id="generateAnnotationsBtn" onclick="generateAnnotations()">
                        Generate Annotations
                    </button>
                    <button class="btn-secondary" id="clearBtn" onclick="clearWorkflow()">
                        Clear
                    </button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating your workflow... This may take a few seconds.</p>
            </div>
            
            <div class="error" id="error">
                <strong>Error:</strong> <span id="errorMessage"></span>
            </div>
            
            <div class="workflow" id="workflow"></div>
            <div class="workflow" id="annotations"></div>
        </div>
    </div>
    <script>
        async function generateWorkflow() {
            const taskInput = document.getElementById('taskInput').value.trim();
            const validateSearches = document.getElementById('validateSearches').checked;
            const loading = document.getElementById('loading');
            const workflowDiv = document.getElementById('workflow');
            const errorDiv = document.getElementById('error');
            const generateBtn = document.getElementById('generateBtn');
            
            if (!taskInput) {
                alert('Please enter a task description');
                return;
            }
            
            // Reset UI
            loading.classList.add('active');
            workflowDiv.classList.remove('active');
            workflowDiv.innerHTML = '';
            errorDiv.classList.remove('active');
            generateBtn.disabled = true;
            
            try {
                const response = await fetch('/api/generate-workflow', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        task: taskInput,
                        validate_searches: validateSearches
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to generate workflow');
                }
                
                const workflow = await response.json();
                displayWorkflow(workflow);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMessage').textContent = error.message;
                errorDiv.classList.add('active');
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        }
        
        function displayWorkflow(workflow) {
            const workflowDiv = document.getElementById('workflow');
            
            const difficultyClass = `badge-${workflow.difficulty.toLowerCase()}`;
            
            let html = `
                <div class="workflow-header">
                    <h2>${workflow.task_summary}</h2>
                    
                    <!-- NEW: Simple Explanation Section -->
                    <div class="simple-explanation">
                        <div class="explanation-icon">💡</div>
                        <div class="explanation-text">
                            <strong>What you'll do:</strong><br>
                            ${workflow.simple_explanation}
                        </div>
                    </div>
                    
                    <div class="workflow-meta">
                        <div class="meta-item">
                            <strong>📊 Steps:</strong> ${workflow.total_steps}
                        </div>
                        <div class="meta-item">
                            <strong>⏱️ Time:</strong> ${workflow.estimated_time}
                        </div>
                        <div class="meta-item">
                            <strong>Difficulty:</strong> 
                            <span class="badge ${difficultyClass}">${workflow.difficulty}</span>
                        </div>
                    </div>
                </div>
            `;
            
            workflow.steps.forEach(step => {
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(step.search_query)}`;
                
                html += `
                    <div class="step">
                        <div class="step-header">
                            <div class="step-number">${step.step_number}</div>
                            <div class="step-title">${step.description}</div>
                        </div>
                        
                        <div class="search-box">
                            <div class="search-label">🔍 Google Search:</div>
                            <div class="search-query">
                                <code>${step.search_query}</code>
                                <a href="${searchUrl}" target="_blank" class="test-search">Test Search</a>
                            </div>
                            <div class="expected-results">
                                <strong>Expected:</strong> ${step.expected_results}
                            </div>
                        </div>
                        
                        <div class="instructions">
                            <strong>📋 Instructions:</strong><br>
                            ${step.instructions}
                        </div>
                        
                        <div class="key-phrases">
                            <strong>🔑 Key Phrases to Look For:</strong>
                            <div class="key-phrases-list">
                                ${step.key_phrases.map(phrase => `<span class="phrase-tag">${phrase}</span>`).join('')}
                            </div>
                        </div>
                        
                        <details class="alternatives">
                            <summary>Alternative Searches</summary>
                            ${step.alternative_searches.map(alt => `<div class="alt-search">${alt}</div>`).join('')}
                        </details>
                `;
                
                if (step.validation) {
                    html += `
                        <div class="validation">
                            <div class="validation-title">✅ Search Validation</div>
                            <p><strong>Status:</strong> ${step.validation.is_verified ? 'Verified ✓' : 'Needs Review'}</p>
                            <p><strong>Recommended Result:</strong> #${step.validation.recommended_result || 'N/A'}</p>
                            <p><strong>Top Search Results:</strong></p>
                            <ul class="search-results">
                                ${step.validation.search_results.map((result, idx) => `
                                    <li>
                                        <a href="${result.link}" target="_blank">${result.title}</a>
                                        <p style="font-size: 12px; color: #666; margin-top: 4px;">${result.snippet}</p>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                html += `</div>`;
            });
            
            workflowDiv.innerHTML = html;
            workflowDiv.classList.add('active');
        }
        
        function clearWorkflow() {
            document.getElementById('taskInput').value = '';
            document.getElementById('validateSearches').checked = false;
            document.getElementById('workflow').classList.remove('active');
            document.getElementById('workflow').innerHTML = '';
            document.getElementById('annotations').classList.remove('active');
            document.getElementById('annotations').innerHTML = '';
            document.getElementById('error').classList.remove('active');
        }
        
        async function generateAnnotations() {
            const taskInput = document.getElementById('taskInput').value.trim();
            const loading = document.getElementById('loading');
            const annotationDiv = document.getElementById('annotations');
            const errorDiv = document.getElementById('error');
            const generateBtn = document.getElementById('generateAnnotationsBtn');
            
            if (!taskInput) {
                alert('Please enter a task description');
                return;
            }
            
            loading.classList.add('active');
            annotationDiv.classList.remove('active');
            annotationDiv.innerHTML = '';
            errorDiv.classList.remove('active');
            generateBtn.disabled = true;
            
            try {
                const response = await fetch('/api/generate-annotations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: taskInput })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to generate annotations');
                }
                
                const annotations = await response.json();
                
                // Store for export
                window.lastAnnotationData = annotations;
                
                displayAnnotations(annotations);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMessage').textContent = error.message;
                errorDiv.classList.add('active');
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        }
        
        function displayAnnotations(annotations) {
            const annotationDiv = document.getElementById('annotations');
            
            let html = `
                <div class="annotation-header">
                    <h2>📋 Annotation Sequence</h2>
                    <p><strong>Task:</strong> ${annotations.task}</p>
                    <div class="annotation-meta">
                        <span><strong>📊 Total Steps:</strong> ${annotations.total_steps}</span>
                        <span><strong>⚡ Total Actions:</strong> ${annotations.total_estimated_actions}</span>
                        ${annotations.estimated_time ? `<span><strong>⏱️ Estimated Time:</strong> ${annotations.estimated_time}</span>` : ''}
                    </div>
                    <div class="annotation-guidelines">
                        <strong>📝 Guidelines:</strong> ${annotations.annotation_guidelines}
                    </div>
                </div>
            `;
            
            annotations.annotation_sequences.forEach(seq => {
                html += `
                    <div class="annotation-step">
                        <div class="step-header">
                            <h3>Step ${seq.step_number}: ${seq.step_description}</h3>
                            <span class="step-duration">⏱️ ~${seq.estimated_duration_seconds}s</span>
                        </div>
                        <div class="step-search">
                            <strong>🔍 Search Query:</strong> 
                            <code>${seq.search_query}</code>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(seq.search_query)}" 
                               target="_blank" class="test-search-btn">Test Search</a>
                        </div>
                        
                        <div class="actions-list">
                            <h4>Expected Actions (${seq.expected_actions.length}):</h4>
                            ${seq.expected_actions.map((action, idx) => `
                                <div class="action-item">
                                    <div class="action-number">${idx + 1}</div>
                                    <div class="action-details">
                                        <span class="action-type-badge badge-${action.action_type}">${action.action_type}</span>
                                        <p class="action-description">${action.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            html += `
                <div class="export-annotations">
                    <button class="btn-secondary" onclick="exportAnnotationsJSON()">💾 Export JSON</button>
                    <button class="btn-secondary" onclick="exportAnnotationsCSV()">📊 Export CSV</button>
                </div>
            `;
            
            annotationDiv.innerHTML = html;
            annotationDiv.classList.add('active');
        }
        
        function exportAnnotationsJSON() {
            const annotationDiv = document.getElementById('annotations');
            if (!annotationDiv.classList.contains('active')) {
                alert('No annotations to export');
                return;
            }
            
            const data = window.lastAnnotationData;
            
            if (!data) {
                alert('Annotation data not available');
                return;
            }
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `annotations_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function exportAnnotationsCSV() {
            const data = window.lastAnnotationData;
            
            if (!data) {
                alert('Annotation data not available');
                return;
            }
            
            let csv = 'Step,Action #,Action Type,Description\n';
            
            data.annotation_sequences.forEach(seq => {
                seq.expected_actions.forEach((action, idx) => {
                    csv += `"Step ${seq.step_number}","${idx + 1}","${action.action_type}","${action.description.replace(/"/g, '""')}"\n`;
                });
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `annotations_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
